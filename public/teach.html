<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uczenie klasyfikatora · Baza TU</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.back{color:#2563eb;text-decoration:none}.stats{display:flex;gap:10px;align-items:center}.pill{background:#e8eef8;border-radius:999px;padding:8px 13px;font-weight:700}.card{background:#fff;border:1px solid #dde5ef;border-radius:16px;padding:24px;margin-top:20px;box-shadow:0 5px 20px #1720330a}.meta{display:flex;gap:16px;flex-wrap:wrap;color:#64748b;font-size:13px}.subject{font-size:24px;font-weight:800;margin:14px 0}.body{white-space:pre-wrap;line-height:1.55;max-height:430px;overflow:auto;background:#f8fafc;border-radius:12px;padding:18px;border:1px solid #edf1f6}.question{text-align:center;font-size:18px;font-weight:800;margin:24px 0 14px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.cat{padding:16px 10px;border:1px solid #cbd5e1;background:#fff;border-radius:11px;font-weight:750;cursor:pointer;font-size:14px}.cat:hover{border-color:#2563eb;background:#eff6ff}.cat:disabled{opacity:.45}.foot{margin-top:16px;color:#64748b;font-size:13px;text-align:center}.train{margin-top:18px;display:flex;justify-content:center;gap:10px}.primary{border:0;background:#2563eb;color:#fff;border-radius:9px;padding:11px 16px;font-weight:800;cursor:pointer}.primary:disabled{opacity:.5}.msg{text-align:center;margin-top:10px;font-weight:700}@media(max-width:760px){.buttons{grid-template-columns:1fr 1fr}.subject{font-size:20px}}</style></head><body><div class="wrap"><div class="top"><div><h1>Interfejs białkowy 🧠</h1><div>Ręczne oznaczanie danych uczących. Klikasz kategorię → następny mail.</div></div><div><a class="back" href="/">← Baza TU</a></div></div><div class="card"><div class="stats"><span class="pill">Oznaczone: <b id="count">0</b></span><span id="model" class="pill">Model: jeszcze nieuczony</span></div><div id="mail"><div class="subject">Ładowanie…</div></div><div class="question">Do jakiej kategorii należy ten komunikat?</div><div id="buttons" class="buttons"></div><div class="foot">Skróty klawiaturowe 1–7 odpowiadają przyciskom od lewej. Nie sugerujemy się obecną automatyczną kategorią.</div><div class="train"><button id="train" class="primary">Wytrenuj teraz</button></div><div id="msg" class="msg"></div></div></div><script>const cats=['Konkursy i akcje','Promocje i zniżki','Produkty','Procedury i zmiany','Systemy','Szkolenia','Pozostałe'];let current=null,busy=false;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o){const r=await fetch(u,o),t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{}if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}function lock(v){busy=v;document.querySelectorAll('.cat').forEach(b=>b.disabled=v)}async function status(){const s=await api('/api/light/status');$('#count').textContent=s.labels;$('#model').textContent=s.model?`Model: ${s.model.documents} przykładów`:'Model: jeszcze nieuczony';$('#train').disabled=s.labels<10}async function next(){lock(true);try{current=await api('/api/light/label-next');$('#mail').innerHTML=`<div class="meta"><span>${esc(current.insurer)}</span><span>${esc(current.received_at)}</span><span>${esc(current.sender)}</span></div><div class="subject">${esc(current.title)}</div><div class="body">${esc(current.body_text)}</div>`}catch(e){current=null;$('#mail').innerHTML=`<div class="subject">${esc(e.message)}</div>`}finally{lock(false)}}async function label(cat){if(!current||busy)return;lock(true);try{const r=await api('/api/light/label/'+current.id,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({category:cat})});$('#count').textContent=r.human_labels;$('#msg').textContent='';await next();await status()}catch(e){$('#msg').textContent=e.message;lock(false)}}$('#buttons').innerHTML=cats.map((c,i)=>`<button class="cat" data-cat="${esc(c)}"><b>${i+1}</b> · ${esc(c)}</button>`).join('');$('#buttons').onclick=e=>{const b=e.target.closest('.cat');if(b)label(b.dataset.cat)};document.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='7')label(cats[+e.key-1])});$('#train').onclick=async()=>{try{$('#msg').textContent='Trening…';const r=await api('/api/light/train',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});$('#msg').textContent=`Gotowe: ${r.documents} maili, ${r.vocab} cech, trening ${r.elapsed_ms} ms.`;await status()}catch(e){$('#msg').textContent=e.message}};status().then(next);</script></body></html>
